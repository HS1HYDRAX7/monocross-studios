<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Campaigns · Monocross admin</title>
<link rel="icon" href="../../assets/bloodtubies/icons/kI9uggseNTe7.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/system.css">
<style>
body { padding: 24px 0 96px; }
.wrap { width: min(1100px, calc(100% - 32px)); margin-inline: auto; display: grid; gap: 40px; }
h1 { font: 900 clamp(40px, 7vw, 64px) / 0.95 var(--font-display); text-transform: uppercase; }
h2 { font: 900 32px / 1 var(--font-display); text-transform: uppercase; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); }
.row { display: grid; gap: 12px; padding: 16px; border-top: 1px solid var(--line); grid-template-columns: 1fr; }
.row:first-child { border-top: 0; }
@media (min-width: 760px) { .row { grid-template-columns: 1.4fr 1fr auto; align-items: center; } }
.name { font-weight: 700; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.meta { font: 500 13px / 1.5 var(--font-mono); color: var(--text-muted); overflow-wrap: anywhere; }
.pill { font: 500 12px / 1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; padding: 5px 8px; border-radius: 999px; background: var(--surface-raised); color: var(--text-muted); }
.pill.on { background: var(--success-soft); color: var(--success); }
.pill.red { background: var(--accent-soft); color: var(--accent); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-sm { min-height: 40px; padding: 0 14px; }
dialog { width: min(640px, calc(100% - 24px)); max-height: 92vh; overflow: auto; background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); padding: 24px; }
dialog::backdrop { background: rgba(0,0,0,.7); }
form { display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-size: 14px; color: var(--text-muted); }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface-sunk); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); min-height: 44px; padding: 8px 12px; width: 100%; }
.two { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; } }
.checks { display: flex; gap: 14px; flex-wrap: wrap; }
.checks label { display: flex; align-items: center; gap: 8px; color: var(--text); }
.checks input { width: 20px; min-height: 20px; }
.err { color: var(--accent); font-weight: 600; min-height: 1.4em; }
.notice { padding: 24px; text-align: center; color: var(--text-muted); }
pre { margin: 0; padding: 14px; overflow-x: auto; background: var(--surface-sunk); border-radius: var(--radius-sm); font: 500 13px / 1.6 var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><p class="meta"><a href="/admin">&larr; Admin</a></p><h1>Campaigns</h1></div>
    <div class="acts">
      <button class="btn btn-secondary" id="newSite" type="button">New site</button>
      <button class="btn btn-primary" id="newCampaign" type="button">New campaign</button>
    </div>
  </div>
  <p class="notice" id="gate" hidden>Log in at <a href="/admin">/admin</a> first, then come back.</p>

  <section id="campaignsSection" hidden>
    <h2>Popups and ads</h2><p class="meta" style="margin:6px 0 14px">Counts are the last 90 days.</p>
    <div class="panel" id="campaigns"></div>
  </section>
  <section id="sitesSection" hidden>
    <h2>Sites</h2><p class="meta" style="margin:6px 0 14px">A site only gets campaigns when its id, token and domain all match.</p>
    <div class="panel" id="sites"></div>
  </section>
</div>

<dialog id="siteDialog" aria-labelledby="siteDlgTitle">
  <form id="siteForm">
    <h2 id="siteDlgTitle">Site</h2>
    <div class="two"><label>Id (lowercase, dashes)<input name="id" required pattern="[a-z0-9][a-z0-9-]{1,39}"></label><label>Name<input name="name" required maxlength="60"></label></div>
    <label>Allowed domains, one per line (example.com or *.example.com)<textarea name="domains" rows="3" required></textarea></label>
    <div class="checks"><label><input type="checkbox" name="kind_institutional" checked> Studio popups</label><label><input type="checkbox" name="kind_ad" checked> Ads</label><label><input type="checkbox" name="enabled" checked> Enabled</label></div>
    <p class="err" id="siteErr" role="alert"></p>
    <div class="acts"><button class="btn btn-primary" type="submit">Save site</button><button class="btn btn-secondary" type="button" data-close>Cancel</button></div>
  </form>
</dialog>

<dialog id="campDialog" aria-labelledby="campDlgTitle">
  <form id="campForm">
    <h2 id="campDlgTitle">Campaign</h2>
    <div class="two"><label>Id<input name="id" required pattern="[a-z0-9][a-z0-9-]{1,39}"></label>
      <label>Template<select name="template"><option value="promo">Promo / ad</option><option value="discord">Official Discord</option><option value="tiktok">Official TikTok</option></select></label></div>
    <div class="two"><label>Kind<select name="kind"><option value="ad">Ad</option><option value="institutional">Studio popup</option></select></label>
      <label>Placement<select name="placement"><option value="corner">Corner card</option><option value="modal">Modal</option><option value="banner">Bottom banner</option><option value="inline">Inline slot</option></select></label></div>
    <div class="two"><label>Title (60)<input name="title" required maxlength="60"></label><label>Button label (24)<input name="cta" required maxlength="24"></label></div>
    <label>Text (160)<textarea name="body" rows="2" maxlength="160"></textarea></label>
    <label>Link (https only; official templates are locked)<input name="url" type="url" placeholder="https://"></label>
    <div class="two"><label>Image (https, optional)<input name="image" placeholder="https://"></label><label>Size (inline)<select name="size"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></label></div>
    <div class="two"><label>Start<input name="start" type="datetime-local"></label><label>End<input name="end" type="datetime-local"></label></div>
    <div class="two"><label>Priority (0 to 100)<input name="priority" type="number" min="0" max="100" value="50"></label><label>Languages (en, pt; empty = all)<input name="languages" placeholder="en, pt"></label></div>
    <div class="two"><label>Delay (seconds)<input name="delay" type="number" min="0" max="120" value="8"></label><label>Show after scroll (%)<input name="scroll" type="number" min="0" max="100" value="0"></label></div>
    <div class="two"><label>Hide after close (days)<input name="dismiss" type="number" min="1" max="365" value="7"></label><label>Hide after click (days)<input name="click" type="number" min="1" max="365" value="90"></label></div>
    <div class="checks" id="deviceChecks"><label><input type="checkbox" name="dev" value="mobile"> Mobile only</label><label><input type="checkbox" name="dev" value="tablet"> Tablet</label><label><input type="checkbox" name="dev" value="desktop"> Desktop</label></div>
    <fieldset style="border:0;padding:0;margin:0"><legend class="meta">Show on these sites</legend><div class="checks" id="siteChecks"></div></fieldset>
    <label class="checks"><span><input type="checkbox" name="active"> Active</span></label>
    <p class="err" id="campErr" role="alert"></p>
    <div class="acts"><button class="btn btn-primary" type="submit">Save campaign</button><button class="btn btn-secondary" type="button" data-close>Cancel</button></div>
  </form>
</dialog>

<script>
(function () {
  'use strict';
  var state = null;
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function api(body) {
    return fetch('/api/admin/ads', body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Request failed'); e.status = r.status; throw e; } return d; }); });
  }
  function load() {
    return api().then(function (d) { state = d; $('gate').hidden = true; $('campaignsSection').hidden = false; $('sitesSection').hidden = false; render(); })
      .catch(function (e) { if (e.status === 401) { $('gate').hidden = false; } else { alert(e.message); } });
  }
  function button(label, fn, cls) { var b = el('button', 'btn btn-sm ' + (cls || 'btn-secondary'), label); b.type = 'button'; b.addEventListener('click', fn); return b; }
  function pct(a, b) { return b ? (100 * a / b).toFixed(1) + '%' : '0%'; }
  function snippet(s) { return '<script async src="' + location.origin + '/embed.js"\n  data-site="' + s.id + '" data-token="' + s.token + '"><\/script>'; }

  function render() {
    var camps = $('campaigns'); camps.textContent = '';
    state.campaigns.slice().sort(function (a, b) { return b.priority - a.priority; }).forEach(function (c) {
      var st = state.stats[c.id] || { impression: 0, click: 0, close: 0 };
      var row = el('div', 'row');
      var left = el('div'); var n = el('div', 'name', c.title);
      n.appendChild(el('span', 'pill ' + (c.active ? 'on' : ''), c.active ? 'active' : 'off'));
      n.appendChild(el('span', 'pill', c.kind === 'ad' ? 'ad' : 'studio'));
      n.appendChild(el('span', 'pill', c.placement));
      left.appendChild(n); left.appendChild(el('div', 'meta', c.id + ' · sites: ' + ((c.sites || []).join(', ') || 'none') + ' · priority ' + c.priority));
      var mid = el('div', 'meta', st.impression + ' views · ' + st.click + ' clicks (' + pct(st.click, st.impression) + ') · ' + st.close + ' closed');
      var acts = el('div', 'acts');
      acts.appendChild(button(c.active ? 'Turn off' : 'Turn on', function () { act({ action: 'campaign.toggle', id: c.id, active: !c.active }); }));
      acts.appendChild(button('Edit', function () { openCampaign(c); }));
      acts.appendChild(button('Delete', function () { if (confirm('Delete ' + c.title + '?')) act({ action: 'campaign.delete', id: c.id }); }));
      row.appendChild(left); row.appendChild(mid); row.appendChild(acts); camps.appendChild(row);
    });
    var sites = $('sites'); sites.textContent = '';
    state.sites.forEach(function (s) {
      var row = el('div', 'row');
      var left = el('div'); var n = el('div', 'name', s.name);
      n.appendChild(el('span', 'pill ' + (s.enabled ? 'on' : 'red'), s.enabled ? 'enabled' : 'disabled'));
      if (s.builtin) n.appendChild(el('span', 'pill', 'built in'));
      left.appendChild(n); left.appendChild(el('div', 'meta', s.id + ' · ' + s.domains.join(', ')));
      left.appendChild(el('div', 'meta', 'token: ' + s.token));
      var mid = el('div', 'meta', 'allows: ' + (s.allow_kinds || []).join(', '));
      var acts = el('div', 'acts');
      acts.appendChild(button('Copy snippet', function (ev) { navigator.clipboard.writeText(snippet(s)); ev.target.textContent = 'Copied'; setTimeout(function () { ev.target.textContent = 'Copy snippet'; }, 1500); }));
      if (!s.builtin) {
        acts.appendChild(button('Edit', function () { openSite(s); }));
        acts.appendChild(button('New token', function () { if (confirm('The old token stops working at once. Continue?')) act({ action: 'site.rotate', id: s.id }); }));
        acts.appendChild(button('Delete', function () { if (confirm('Delete ' + s.name + '?')) act({ action: 'site.delete', id: s.id }); }));
      }
      row.appendChild(left); row.appendChild(mid); row.appendChild(acts); sites.appendChild(row);
    });
  }
  function act(body) { return api(body).then(load).catch(function (e) { alert(e.message); }); }

  function openSite(s) {
    var f = $('siteForm'); f.reset(); $('siteErr').textContent = '';
    if (s) { f.id.value = s.id; f.id.readOnly = true; f.name.value = s.name; f.domains.value = s.domains.join('\n'); f.kind_institutional.checked = s.allow_kinds.indexOf('institutional') > -1; f.kind_ad.checked = s.allow_kinds.indexOf('ad') > -1; f.enabled.checked = s.enabled; }
    else f.id.readOnly = false;
    $('siteDialog').showModal();
  }
  function openCampaign(c) {
    var f = $('campForm'); f.reset(); $('campErr').textContent = '';
    var box = $('siteChecks'); box.textContent = '';
    state.sites.forEach(function (s) { var l = el('label'); var i = el('input'); i.type = 'checkbox'; i.name = 'site'; i.value = s.id; i.checked = c ? (c.sites || []).indexOf(s.id) > -1 : false; l.appendChild(i); l.appendChild(document.createTextNode(' ' + s.name)); box.appendChild(l); });
    f.id.readOnly = !!c;
    if (c) {
      ['id', 'template', 'kind', 'placement', 'title', 'cta', 'body', 'url', 'image', 'size', 'priority'].forEach(function (k) { f[k].value = c[k] || ''; });
      f.start.value = c.start ? c.start.slice(0, 16) : ''; f.end.value = c.end ? c.end.slice(0, 16) : '';
      f.languages.value = c.targeting.languages.join(', '); f.delay.value = c.frequency.delay_ms / 1000; f.scroll.value = c.frequency.scroll_pct;
      f.dismiss.value = c.frequency.dismiss_days; f.click.value = c.frequency.click_days; f.active.checked = c.active;
      [].forEach.call(document.querySelectorAll('[name=dev]'), function (d) { d.checked = c.targeting.devices.indexOf(d.value) > -1; });
    }
    $('campDialog').showModal();
  }
  $('siteForm').addEventListener('submit', function (e) {
    e.preventDefault(); var f = e.target; var kinds = [];
    if (f.kind_institutional.checked) kinds.push('institutional'); if (f.kind_ad.checked) kinds.push('ad');
    api({ action: 'site.save', site: { id: f.id.value, name: f.name.value, domains: f.domains.value.split(/[\n,]/).map(function (s) { return s.trim(); }).filter(Boolean), allow_kinds: kinds, enabled: f.enabled.checked } })
      .then(function () { $('siteDialog').close(); return load(); }).catch(function (er) { $('siteErr').textContent = er.message; });
  });
  $('campForm').addEventListener('submit', function (e) {
    e.preventDefault(); var f = e.target;
    var c = {
      id: f.id.value, template: f.template.value, kind: f.kind.value, placement: f.placement.value, size: f.size.value,
      title: f.title.value, body: f.body.value, cta: f.cta.value, url: f.url.value, image: f.image.value, active: f.active.checked,
      priority: f.priority.value, start: f.start.value ? new Date(f.start.value).toISOString() : '', end: f.end.value ? new Date(f.end.value).toISOString() : '',
      frequency: { delay_ms: Number(f.delay.value) * 1000, scroll_pct: f.scroll.value, session_cap: 1, dismiss_days: f.dismiss.value, click_days: f.click.value },
      targeting: { languages: f.languages.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean), devices: [].filter.call(document.querySelectorAll('[name=dev]'), function (d) { return d.checked; }).map(function (d) { return d.value; }), paths: [] },
      sites: [].filter.call(document.querySelectorAll('[name=site]'), function (d) { return d.checked; }).map(function (d) { return d.value; })
    };
    api({ action: 'campaign.save', campaign: c }).then(function () { $('campDialog').close(); return load(); }).catch(function (er) { $('campErr').textContent = er.message; });
  });
  [].forEach.call(document.querySelectorAll('[data-close]'), function (b) { b.addEventListener('click', function () { b.closest('dialog').close(); }); });
  $('newSite').addEventListener('click', function () { openSite(null); });
  $('newCampaign').addEventListener('click', function () { if (state) openCampaign(null); });
  load();
})();
</script>
</body>
</html>
